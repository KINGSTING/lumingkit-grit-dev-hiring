services:
  # 1. MySQL Relational Storage Core
  db:
    image: mysql:8.0
    container_name: grit_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: grit_archive
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_persistent_data:/var/lib/mysql
      - ./database/database.sql:/docker-entrypoint-initdb.d/database.sql
    networks:
      - grit_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5

  # 2. Django REST Framework Engine
  backend:
    build: ./backend
    container_name: grit_django_api
    restart: always
    # FORCE the server to bind to 0.0.0.0:8000
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: grit_archive
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_PORT: 3306
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - grit_network

  # 3. React SPA Interface Channel
  frontend:
    build: ./frontend
    container_name: grit_react_ui
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    stdin_open: true
    tty: true
    networks:
      - grit_network

volumes:
  mysql_persistent_data:

networks:
  grit_network:
    driver: bridge